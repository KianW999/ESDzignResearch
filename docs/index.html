    <!-- GitHub Pages Canonicalization, SPA Router & Asset Recovery -->
    <script>
      (function() {
        // 1. Single-page app query decoder (rafgraph/spa-github-pages protocol)
        var l = window.location;
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }

        // 2. Trailing slash corrector for repository subpaths on GitHub Pages
        var p = l.pathname;
        if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          l.replace(l.protocol + '//' + l.host + p + '/' + l.search + l.hash);
          return;
        }

        // 3. Uncompiled Source Detector:
        // If someone deploys uncompiled root repo directly to GitHub Pages (deploy from branch / root),
        // redirect seamlessly to the pre-compiled /docs/ directory where production assets exist.
        if (l.hostname.endsWith('github.io') && !p.includes('/docs/')) {
          var isSourceHtml = !!document.querySelector('script[src*="/src/main.tsx"]');
          if (isSourceHtml) {
            var clean = p.endsWith('/') ? p : p + '/';
            l.replace(clean + 'docs/' + l.search + l.hash);
            return;
          }
        }
      })();

      // 4. Global Asset Recovery: If a relative asset request misses repository path, auto-correct and reload
      window.addEventListener('error', function(e) {
        var el = e.target;
        if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
          var url = el.src || el.href;
          if (url && url.includes('/assets/')) {
            var pathname = window.location.pathname;
            var segments = pathname.split('/').filter(Boolean);
            if (segments.length > 0 && segments[0] !== 'assets') {
              var repoName = segments[0];
              if (!url.includes('/' + repoName + '/assets/')) {
                var fileName = url.split('/assets/').pop();
                var corrected = window.location.origin + '/' + repoName + '/assets/' + fileName;
                if (el.tagName === 'SCRIPT' && !document.querySelector('script[data-recovered="' + fileName + '"]')) {
                  var s = document.createElement('script');
                  s.type = 'module';
                  s.crossOrigin = 'anonymous';
                  s.src = corrected;
                  s.setAttribute('data-recovered', fileName);
                  document.head.appendChild(s);
                } else if (el.tagName === 'LINK' && !document.querySelector('link[data-recovered="' + fileName + '"]')) {
                  var link = document.createElement('link');
                  link.rel = 'stylesheet';
                  link.crossOrigin = 'anonymous';
                  link.href = corrected;
                  link.setAttribute('data-recovered', fileName);
                  document.head.appendChild(link);
                }
              }
            }
          }
        }
      }, true);
    </script>
