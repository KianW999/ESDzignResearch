<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnywhereGlobe - Office Interior Design Portfolio</title>
    <meta property="og:title" content="AnywhereGlobe - Office Interior Design Portfolio" />
    <meta name="description" content="A 3D spherical gallery of office interior design and workplace architectural portfolio viewing. Features smooth orbit controls, momentum dragging, 48 curated workspace interiors, custom interior badges, ESG context, and detailed design dossiers." />
    <meta property="og:description" content="A 3D spherical gallery of office interior design and workplace architectural portfolio viewing. Features smooth orbit controls, momentum dragging, 48 curated workspace interiors, custom interior badges, ESG context, and detailed design dossiers." />
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0; padding: 0; min-height: 100vh; overflow: hidden; font-family: system-ui, -apple-system, sans-serif;">
    <div id="root">
      <!-- Graceful Pre-hydration / Fallback Screen -->
      <div id="initial-loader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; z-index: 9999;">
        <div style="width: 38px; height: 38px; border: 2.5px solid rgba(255,255,255,0.1); border-top-color: #34d399; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-family: monospace; color: #ffffff;">WORKSPACE SPHERE</div>
        <div style="font-size: 11px; color: #94a3b8; font-family: monospace; margin-top: 6px;">Loading 48 Interior Architecture Portfolios...</div>
        
        <!-- Diagnostic notice shown if uncompiled code is served by mistake -->
        <noscript>
          <div style="margin-top: 24px; padding: 12px 16px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; color: #fca5a5; font-size: 12px; max-width: 360px; text-align: center;">
            JavaScript is required to experience the 3D portfolio sphere.
          </div>
        </noscript>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
